name: crawl

x-airflow-common: &airflow-common
  build: .
  image: crawl-airflow:2.10.5
  user: "${AIRFLOW_UID:-50000}:0"
  environment: &airflow-environment
    AIRFLOW_CONFIG: /opt/airflow/logs/airflow.cfg
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:?Set AIRFLOW_DB_PASSWORD in .env}@postgres:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?Set AIRFLOW_FERNET_KEY in .env}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY:?Set AIRFLOW_WEBSERVER_SECRET_KEY in .env}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "True"
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    # Data stays in UTC; schedules and the UI follow Vietnam time.
    AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Ho_Chi_Minh
    AIRFLOW__WEBSERVER__DEFAULT_UI_TIMEZONE: Asia/Ho_Chi_Minh
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "True"
    PIPELINE_SOURCE: ${PIPELINE_SOURCE:-vietjobs}
    ARBEITNOW_MAX_PAGES: ${ARBEITNOW_MAX_PAGES:-5}
    ARBEITNOW_SCHEDULE: ${ARBEITNOW_SCHEDULE:-@daily}
    PIPELINE_DATA_ROOT: /opt/airflow/data
    VIETJOBS_CSV_PATH: /opt/airflow/${VIETJOBS_CSV_PATH:-data/VietJobs_sample.csv}
    PIPELINE_DATABASE_URL: postgresql+psycopg2://job_pipeline:${PIPELINE_DB_PASSWORD:?Set PIPELINE_DB_PASSWORD in .env}@postgres:5432/job_pipeline
    AI_PLATFORM_IMPORT_URL: http://host.docker.internal:8000/jobs/import
    AI_PLATFORM_API_KEY: ${AI_PLATFORM_API_KEY:-}
    DELIVERY_ENABLED: ${DELIVERY_ENABLED:-false}
    DELIVERY_PAYLOAD_PROFILE: ${DELIVERY_PAYLOAD_PROFILE:-ai_platform_v1}
    DELIVERY_MISSING_COMPANY: ${DELIVERY_MISSING_COMPANY:-block}
    DELIVERY_MAX_BYTES: ${DELIVERY_MAX_BYTES:-1000000}
    DELIVERY_MAX_RECORDS: ${DELIVERY_MAX_RECORDS:-20}
    DELIVERY_TIMEOUT_SECONDS: ${DELIVERY_TIMEOUT_SECONDS:-300}
    DELIVERY_MAX_ATTEMPTS: ${DELIVERY_MAX_ATTEMPTS:-3}
    PIPELINE_EXPORT_ROOT: /opt/airflow/data/export
  volumes:
    - ./dags:/opt/airflow/dags:ro
    - ./data:/opt/airflow/data
    - airflow-logs:/opt/airflow/logs
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PIPELINE_DB_PASSWORD: ${PIPELINE_DB_PASSWORD:?Set PIPELINE_DB_PASSWORD in .env}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD:?Set AIRFLOW_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    environment:
      <<: *airflow-environment
      AIRFLOW_ADMIN_USERNAME: ${AIRFLOW_ADMIN_USERNAME:?Set AIRFLOW_ADMIN_USERNAME in .env}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?Set AIRFLOW_ADMIN_PASSWORD in .env}
      AIRFLOW_ADMIN_EMAIL: ${AIRFLOW_ADMIN_EMAIL:-admin@example.invalid}
    command: ["bash", "/opt/airflow/docker/airflow-init.sh"]
    depends_on:
      postgres:
        condition: service_healthy

  airflow:
    <<: *airflow-common
    command: ["bash", "/opt/airflow/docker/airflow-start.sh"]
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --fail --silent http://localhost:8080/health |
          python -c 'import json,sys; h=json.load(sys.stdin); sys.exit(0 if h["metadatabase"]["status"] == h["scheduler"]["status"] == "healthy" else 1)'
      interval: 15s
      timeout: 10s
      start_period: 60s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
  airflow-logs:
