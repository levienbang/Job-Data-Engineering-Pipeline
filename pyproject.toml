[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "job-data-pipeline"
version = "0.1.0"
description = "Job data ingestion and preprocessing before AI Career Platform import"
readme = "README.md"
requires-python = ">=3.12,<4"
dependencies = [
    "httpx>=0.27,<1",
    "beautifulsoup4>=4.12,<5",
    "polars>=1,<2",
    "duckdb>=1,<2",
    "pydantic>=2,<3",
    "sqlalchemy>=1.4,<2",
    "alembic>=1.13,<2",
    "psycopg2-binary>=2.9,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
airflow = ["apache-airflow>=2.10,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
