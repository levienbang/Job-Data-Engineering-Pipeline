name: CI

# Documentation-only changes skip CI; any code, config or test change still runs it.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".serena/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".serena/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      # The airflow extra lets the DAG import/structure tests run instead of skip.
      - name: Install dependencies
        run: uv sync --frozen --extra dev --extra airflow
      - name: Lint
        run: uv run --frozen ruff check .
      - name: Format
        run: uv run --frozen ruff format --check .
      # Tests use fixtures, SQLite metadata and mocked HTTP: no network sources,
      # databases or paid APIs.
      - name: Tests
        run: uv run --frozen pytest -q
